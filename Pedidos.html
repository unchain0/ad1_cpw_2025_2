<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Chique Elétrico - Pedidos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Cabeçalho -->
    <header>
        <div class="imgLogo">
            <img src="images/logo_topo.png" alt="Logo Chique Elétrico" style="max-width:100%; height:auto;">
        </div>
        <div class="ender">
            Av. Elétrica, 1254<br>
            T: (21) 1254-5678<br>
            contato@chiqueeletrico.com.br
        </div>
    </header>

    <!-- Navegação -->
    <nav>
        <ul>
            <li><a href="index.html" target="_blank">Página Principal</a></li>
            <li><a href="Materiais.html" target="_blank">Materiais</a></li>
            <li><a href="Acabamentos.html" target="_blank">Acabamentos</a></li>
            <li><a href="Pedidos.html" target="_blank">Pedidos</a></li>
        </ul>
    </nav>

    <!-- Formulário de pedidos -->
    <section>
        <h1 class="titulo">Pedidos</h1>
        <div class="divCompras">
            <form id="formPedido">
                <!-- Fieldset esquerdo: dados do cliente -->
                <fieldset class="fsEsq">
                    <legend>Dados do Cliente</legend>
                    <div class="divLinha">
                        <label class="colPri" for="nome">Nome:</label>
                        <input class="inpGrande" type="text" id="nome" name="nome" required>
                    </div>
                    <div class="divLinha">
                        <label class="colPri" for="telefone">Telefone:</label>
                        <input class="impTelef" type="tel" id="telefone" name="telefone" placeholder="(99) 9999-9999">
                        <label class="colPri" for="email" style="margin-left:10px;">E‑mail:</label>
                        <input class="inpGrande" type="email" id="email" name="email">
                    </div>
                    <div class="divLinha">
                        <label class="colPri" for="endereco">Endereço:</label>
                        <textarea class="impEnder" id="endereco" name="endereco" rows="2"></textarea>
                    </div>
                </fieldset>
                <!-- Fieldset direito: pagamento -->
                <fieldset class="fsDir">
                    <legend>Dados de Pagamento</legend>
                    <div class="divLinha">
                        <label class="colPriPag" for="cartao">Nº Cartão:</label>
                        <input class="impNCC" type="text" id="cartao" name="cartao">
                    </div>
                    <div class="divLinha">
                        <label class="colPriPag" for="validade">Validade:</label>
                        <input class="numDD" type="number" id="mes" name="mes" min="1" max="12" placeholder="MM"> /
                        <input class="numQD" type="number" id="ano" name="ano" min="2024" max="2035" placeholder="AAAA">
                    </div>
                </fieldset>
                <div style="clear:both;"></div>
                <!-- Seleção de produtos -->
                <div class="elemEsq">
                    <label class="colLabSelProd" for="produto">Produto:</label>
                    <select class="colSelProd" id="produto" name="produto">
                        <optgroup label="Materiais">
                            <option value="cabos">Cabos - R$10,00</option>
                            <option value="interruptor">Interruptor - R$15,00</option>
                            <option value="tomada">Tomada - R$20,00</option>
                            <option value="lampada">Lâmpada LED - R$5,00</option>
                        </optgroup>
                        <optgroup label="Acabamentos">
                            <option value="acabamento1">Interruptor Simples - R$18,00</option>
                            <option value="acabamento2">Tomada Dupla - R$22,00</option>
                        </optgroup>
                    </select>
                </div>
                <div class="elemEsq linhaProdSel">
                    <label class="colLabSelProd" for="quantidade">Quantidade:</label>
                    <input class="impMedio" type="number" id="quantidade" name="quantidade" min="1" value="1">
                </div>
                <div class="elemEsq linhaProdSel">
                    <label class="colLabSelProd" for="valor">Valor:</label>
                    <input class="impMedio" type="text" id="valor" name="valor" readonly>
                </div>
                <!-- Lista de compras ao lado direito -->
                <div class="elemDir">
                    <label class="colPriCompras" for="lista">Lista de compras:</label><br>
                    <textarea class="listaCompras" id="lista" name="lista" readonly></textarea>
                </div>
                <div style="clear:both;"></div>
                <!-- Botões -->
                <div class="botoes">
                    <button type="submit">Enviar</button>
                    <button type="reset">Limpar</button>
                </div>
            </form>
        </div>
    </section>

    <!-- Script simples para cálculo de valores e atualização da lista -->
    <script>
        (function() {
            const selectProd = document.getElementById('produto');
            const quantidade = document.getElementById('quantidade');
            const valor = document.getElementById('valor');
            const lista = document.getElementById('lista');
            const prices = {
                cabos: 10,
                interruptor: 15,
                tomada: 20,
                lampada: 5,
                acabamento1: 18,
                acabamento2: 22
            };
            function update() {
                const product = selectProd.value;
                const qty = parseInt(quantidade.value, 10) || 0;
                if (prices[product]) {
                    const price = prices[product] * qty;
                    valor.value = 'R$ ' + price.toFixed(2);
                } else {
                    valor.value = '';
                }
            }
            selectProd.addEventListener('change', update);
            quantidade.addEventListener('input', update);
            // atualiza quando a página carrega
            update();
            const form = document.getElementById('formPedido');
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const productName = selectProd.options[selectProd.selectedIndex].text;
                const qty = quantidade.value;
                const price = valor.value;
                lista.value += productName + ' - ' + qty + ' - ' + price + '\n';
            });
        })();
    </script>
</body>
</html>
