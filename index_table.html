<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Chique Elétrico - Versão Tabela</title>
    <!-- O layout desta página é baseado em tabela. As cores e fontes são
         definidas diretamente nos elementos para corresponder ao enunciado
         da avaliação. -->
    <style>
        body {
            background-color: #2277DD;
            color: #FFEE44;
            font-family: 'Lucida Bright', Liberation, serif;
            margin: 0;
            padding: 0;
        }
        a {
            color: #FFEE55;
            text-decoration: none;
        }
        a:visited {
            color: #FFEE33;
        }
        ul {
            list-style-type: square;
            padding-left: 20px;
        }
        ul li {
            line-height: 200%;
            font-family: Verdana, Ubuntu, sans-serif;
        }
        address {
            font-family: Verdana, Ubuntu, sans-serif;
            line-height: 140%;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <table style="width:100%; border-collapse:collapse;">
        <tr>
            <!-- coluna de navegação; expande todas as linhas -->
            <td rowspan="3" style="width:25%; vertical-align: top;">
                <ul>
                    <li><a href="index.html" target="_blank">Página Principal</a></li>
                    <li><a href="Materiais.html" target="_blank">Materiais</a></li>
                    <li><a href="Acabamentos.html" target="_blank">Acabamentos</a></li>
                    <li><a href="Pedidos.html" target="_blank">Pedidos</a></li>
                </ul>
            </td>
            <td style="padding:10px;">
                <!-- logo do canto superior esquerdo -->
                <img src="images/logo_topo.png" alt="Logo Chique Elétrico" style="max-width:100%; height:auto; display:block;">
                <hr style="width:320px; border:1px solid #FFEE44; margin-top:6px;">
            </td>
        </tr>
        <tr>
            <td style="text-align:center; padding:10px;">
                <!-- logo principal e texto de apresentação -->
                <img src="images/logo_central.png" alt="Logo Chique Elétrico" style="width:200px; display:block; margin:0 auto;">
                <p style="font-family:'Lucida Bright', Liberation, serif; font-size:16px; margin-top:10px;">
                    Bem&#8209;vindo à loja de materiais elétricos <strong>Chique Elétrico</strong><br>
                    Apresentamos produtos de qualidade e estilo para clientes exigentes.
                </p>
            </td>
        </tr>
        <tr>
            <td style="padding:10px;">
                <!-- endereço, telefone e email utilizando a tag address -->
                <address style="float:right; text-align:right;">
                    Av. Elétrica, 1254<br>
                    T: (21) 1254-5678<br>
                    contato@chiqueeletrico.com.br
                </address>
            </td>
        </tr>
    </table>
</body>
</html>
